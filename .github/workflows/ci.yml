name: CI — Darukaa.Earth

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────
  # Frontend: lint, test, build
  # ─────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Lint + Test + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN || 'pk.placeholder_token_for_ci_build' }}
          VITE_API_BASE_URL: http://localhost:8000

  # ─────────────────────────────────────────────────────────
  # Backend: lint, test
  # ─────────────────────────────────────────────────────────
  backend:
    name: Backend (Lint + Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # PostGIS database for integration tests
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: darukaa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Wait for PostgreSQL
        run: |
          python -c "
          import socket, time
          for i in range(30):
              try:
                  with socket.create_connection(('localhost', 5432), timeout=2):
                      print('PostgreSQL is ready on localhost:5432')
                      break
              except OSError:
                  time.sleep(1)
          "

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/darukaa_test
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
          CORS_ORIGINS: http://localhost:5173
          ENVIRONMENT: test
        run: alembic upgrade head

      - name: Run pytest
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/darukaa_test
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
          CORS_ORIGINS: http://localhost:5173
          ENVIRONMENT: test
        run: python -m pytest tests/ -v --tb=short
